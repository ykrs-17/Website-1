<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Premium Security Access</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f4f6f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .payment-card { 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            max-width: 380px; 
            width: 100%; 
            text-align: center; 
        }
        h2 { 
            color: #1a202c; 
            margin-bottom: 8px; 
            font-size: 22px;
        }
        .price-tag { 
            font-size: 26px; 
            font-weight: bold; 
            color: #2b6cb0; 
            margin-bottom: 20px; 
        }
        .qr-container { 
            background: #edf2f7; 
            padding: 15px; 
            border-radius: 12px; 
            display: inline-block; 
            margin-bottom: 20px; 
        }
        .qr-container img { 
            width: 200px; 
            height: 200px; 
            display: block; 
        }
        .instructions { 
            font-size: 14px; 
            color: #4a5568; 
            margin-bottom: 20px; 
            line-height: 1.5; 
            text-align: left; 
        }
        .input-group { 
            margin-bottom: 15px; 
            text-align: left; 
        }
        label { 
            font-size: 13px; 
            font-weight: 600; 
            color: #4a5568; 
            display: block; 
            margin-bottom: 6px; 
        }
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #cbd5e0; 
            border-radius: 8px; 
            font-size: 16px; 
            box-sizing: border-box; 
            letter-spacing: 2px; 
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #2b6cb0;
            box-shadow: 0 0 0 3px rgba(66,153,225,0.15);
        }
        .submit-btn { 
            background-color: #2b6cb0; 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 14px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        .submit-btn:hover { 
            background-color: #2c5282; 
        }
        .status-banner { 
            margin-top: 15px; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 14px; 
            display: none; 
            font-weight: 500;
        }
        .error { 
            background-color: #fed7d7; 
            color: #9b2c2c; 
        }
        .success { 
            background-color: #c6f6d5; 
            color: #22543d; 
        }
    </style>
</head>
<body>

<div class="payment-card">
    <h2>Unlock Anti-Scam Protection</h2>
    <div class="price-tag">₹299.00</div>
    
    <div class="qr-container">
        <!-- Renders your custom UPI details automatically using a secure public QR string compiler -->
        <img id="upi-qr" src="" alt="Scan to Pay">
    </div>

    <div class="instructions">
        <strong>1. Scan QR</strong> with any UPI app (GPay, PhonePe, Paytm).<br>
        <strong>2. Submit</strong> your 12-digit UTR transaction ID below for immediate manual database clearance.
    </div>

    <form id="payForm">
        <div class="input-group">
            <label for="utr">Enter 12-Digit UPI UTR Number</label>
            <input 
                type="text" 
                id="utr" 
                maxlength="12" 
                placeholder="e.g. 623456789012" 
                inputmode="numeric" 
                required
            >
        </div>
        <button type="submit" class="submit-btn">Verify Transaction</button>
    </form>
    <div id="banner" class="status-banner"></div>
</div>

<script>
    // Embedded system credentials configuration parameters
    const upiId = "ykrs0124@oksbi";
    const amount = "299.00";
    const payeeName = "Anti-Scam App";
    const note = "App Premium Entry Fee";
    
    // Assembles your secure payment string format
    const upiString = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(payeeName)}&am=${amount}&cu=INR&tn=${encodeURIComponent(note)}`;
    
    // Mount compiled transaction query parameters to generate the scannable graphic code
    document.getElementById("upi-qr").src = `https://qrserver.com{encodeURIComponent(upiString)}`;

    // Client form pipeline Interceptor
    document.getElementById('payForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const utrValue = document.getElementById('utr').value.trim();
        const banner = document.getElementById('banner');

        // Regex script forcing a strict 12-character long continuous numeric sequence 
        if (!/^[0-9]{12}\$/.test(utrValue)) {
            banner.className = "status-banner error";
            banner.innerText = "Error: Input must be exactly 12 numeric digits.";
            banner.style.display = "block";
            return;
        }

        try {
            // Delivers payload to the backend verification server API endpoint
            const response = await fetch('/api/verify-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ utr: utrValue })
            });
            const data = await response.json();

            if (data.success) {
                banner.className = "status-banner success";
                banner.innerText = data.message;
            } else {
                banner.className = "status-banner error";
                banner.innerText = data.message;
            }
            banner.style.display = "block";
        } catch (err) {
            banner.className = "status-banner error";
            banner.innerText = "Connection lost. Try again later.";
            banner.style.display = "block";
        }
    });
</script>

</body>
</html>
